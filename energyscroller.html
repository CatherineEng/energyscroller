<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="energyscroller.css">
        <link rel="stylesheet" href="tiletest/info_section.css">
        <script type="text/javascript" src="tiletest/tilecount.js"></script>
    </head>
    
    <body>
    <div id="topbar_info">
        <div>
        <div id="counter">0 ⚡kWh</div> <!-- unicode: U+26A1 'High Voltage Sign' -->
        <div id="scroll_counter">[0⚡ scrolled]</div>
        </div>
        <div id="table_container">
            <!-- threshold-tables are dynamically constructed and inserted here -->
            <!-- initializer function 'ConstructCounterTables()' [callbacks.js] -->
            
            <!--         example table structure         -->
            <!-- <table class="threshold_table"> <tbody><th>
                <a class="table_counter">0⚡</a> Table_1</th></tbody>
                <li class="good">TESTME_25</li> ... </table> -->
        </div>
        <div id="jump_container"> Jump To:
            <!-- buttons that jump the scroll position to page elements -->
            <!-- see: 'CreateElementButtons()' [callbacks.js] -->
        </div>
    </div>
    <div id="background">
        <div class="resizeable_tiling" energy=15000 tilesize="auto 25px">
            <div class="testme target" name="energy_15K">This section contains 15000 kWh</div>
        </div>
        
        <div class="resizeable_tiling" name="Energy_50K" energy=50000 iconvalue=5 iconcolor=40>
            <div class="testme target" name="energy_50K">This section contains 50000 kWh (icons = 5 kWh)</div>
        </div>
        
        <div class="resizeable_tiling" name="Energy_100K" energy=100000 tilesize="20px" iconcolor=120>
            <div class="testme target" name="energy_100K">This section contains 100000 kWh</div>
        </div>
        
        <div class="target" name="bottom">bottom of the page</div>
    </div>
    </body>
    <!-- must be imported AFTER all elements have been defined -->
    <script type="text/javascript" src="js/SVG_colors.js"></script>
    <script type="text/javascript" src="tiletest/callbacks.js"></script>
</html>
